<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tttryota</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root{
      --bg:#0a0a0a;
      --surface:#141414;
      --border:#222;
      --text:#e8e8e8;
      --muted:#777;
      --accent:#6e56cf;
      --accent-soft:rgba(110,86,207,.12);
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
      overflow:hidden;
    }


    .card{
      position:relative;
      width:100%;
      max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:20px;
      padding:2.5rem 2rem 2rem;
      text-align:center;
      animation:fadeUp .6s ease-out both;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(24px)}
    }

    .avatar{
      width:88px;height:88px;
      border-radius:50%;
      border:2px solid var(--border);
      margin:0 auto 1.2rem;
      overflow:hidden;
      background:var(--accent-soft);
      display:flex;align-items:center;justify-content:center;
    }
    .avatar img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
    }
    .avatar svg{width:40px;height:40px;color:var(--accent)}

    h1{
      font-size:1.35rem;
      font-weight:700;
      letter-spacing:-.02em;
      margin-bottom:.3rem;
    }
    .bio{
      font-size:.85rem;
      color:var(--muted);
      line-height:1.5;
      margin-bottom:1.6rem;
    }

    .links{display:flex;flex-direction:column;gap:.6rem}
    .links a{
      display:flex;align-items:center;justify-content:center;gap:.5rem;
      padding:.75rem 1rem;
      border-radius:12px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
      text-decoration:none;
      font-size:.9rem;
      font-weight:500;
      transition:all .2s;
    }
    .links a:hover{
      background:var(--accent-soft);
      border-color:var(--accent);
    }
    .links a svg{width:18px;height:18px;flex-shrink:0}

    .footer{
      margin-top:1.6rem;
      font-size:.7rem;
      color:var(--muted);
      opacity:.5;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="avatar">
    <img
      src="https://github.com/tttryota.png"
      alt="avatar"
      onerror="this.style.display='none';this.parentElement.querySelector('svg').style.display='block'"
    >
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/>
    </svg>
  </div>

  <h1>tttryota</h1>
  <p class="bio">App Developer</p>

  <div class="links">
    <a href="https://github.com/tttryota" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 .3a12 12 0 00-3.8 23.38c.6.12.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61a3.18 3.18 0 00-1.33-1.76c-1.09-.74.08-.73.08-.73a2.52 2.52 0 011.84 1.24 2.56 2.56 0 003.5 1 2.56 2.56 0 01.76-1.6c-2.67-.3-5.47-1.33-5.47-5.93a4.64 4.64 0 011.24-3.22 4.32 4.32 0 01.12-3.18s1-.33 3.3 1.23a11.37 11.37 0 016 0c2.3-1.56 3.3-1.23 3.3-1.23a4.32 4.32 0 01.12 3.18 4.64 4.64 0 011.24 3.22c0 4.61-2.81 5.63-5.48 5.93a2.86 2.86 0 01.82 2.22v3.29c0 .32.21.7.82.58A12 12 0 0012 .3"/>
      </svg>
      GitHub
    </a>
  </div>

  <p class="footer">&copy; 2025 tttryota</p>
</div>

</body>
</html>
